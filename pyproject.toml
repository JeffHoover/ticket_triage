[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-triage"
version = "0.1.0"

[tool.setuptools.packages.find]
include = ["ticket_triage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["ticket_triage/"]
also_copy = ["hooks/"]
# rag.py is excluded because ChromaDB's singleton (_collection) is inherited
# by mutmut's forked worker processes, making build_collection mutations
# unreachable and causing suspicious exits from ChromaDB's background threads.
do_not_mutate = ["ticket_triage/rag.py"]
